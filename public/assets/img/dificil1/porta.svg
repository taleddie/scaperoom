<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Porta de saída com um teclado de letras">
  <defs>
    <linearGradient id="fundoPorta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071613"/>
      <stop offset="1" stop-color="#020a09"/>
    </linearGradient>
    <linearGradient id="folha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24463e"/>
